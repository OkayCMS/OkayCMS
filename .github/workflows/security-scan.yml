name: Security Scan

on:
  push:
    branches:
      - develop
      - main
      - "fix/**"
      - "feat/**"
      - "test/**"
      - "chore/**"
  pull_request:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${ARCHIVE}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -fsSL -o /tmp/gitleaks_checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (
            cd /tmp
            grep "${ARCHIVE}$" gitleaks_checksums.txt | sha256sum -c -
          )
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose

  semgrep:
    name: Semgrep CE scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.163.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Semgrep CE
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config p/php --config p/security-audit --config p/owasp-top-ten --metrics=off
